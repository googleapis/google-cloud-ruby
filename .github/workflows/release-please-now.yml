name: Release-Please Now
on:
  schedule:
    - cron: '21 10 * * 1-4'
  push:
    tags:
      - '*/v*'
  workflow_dispatch:
    inputs:
      args:
        description: "Extra command line arguments."
        required: false

permissions: {}

jobs:
  add-release-please-label:
    if: ${{ github.repository == 'googleapis/google-cloud-ruby' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_PLEASE_DISABLE: ${{ secrets.RELEASE_PLEASE_DISABLE }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install Ruby 3.3
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: "3.3"
      - name: Install tools
        run: |
          gem install --no-document toys -v '~> 0.22.0'
      - name: execute
        run: |
          toys release label-please -v \
            --github-event-name=${{ github.event_name }} \
            ${GITHUB_EVENT_INPUTS_ARGS}
        env:
          GITHUB_EVENT_INPUTS_ARGS: ${{ github.event.inputs.args }}

  publish-rubygems-exit-gate:
    if: ${{ github.repository == 'googleapis/google-cloud-ruby' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install Ruby 3.3
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9
        with:
          ruby-version: "3.3"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Build and stage gem to OSS Exit Gate
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PKG_NAME="${TAG_NAME%/v*}"
          VERSION="${TAG_NAME##*/v}"
          cd "${PKG_NAME}"
          gem build "${PKG_NAME}.gemspec"
          export GEM_HOST_API_KEY="Bearer $(gcloud auth print-access-token)"
          gem push "${PKG_NAME}-${VERSION}.gem" \
            --host "https://us-ruby.pkg.dev/oss-exit-gate-prod/google-cloud-ruby--rubygems"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "${PKG_NAME}",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/google-cloud-ruby/rubygems/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
